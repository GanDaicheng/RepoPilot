[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "A controlled autonomous development agent for real Git repositories"
requires-python = ">=3.12"
dependencies = [
    "unidiff>=0.7.5,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "integration: tests that exercise multiple RepoPilot components",
    "docker: tests that require a running Docker daemon",
]

[tool.setuptools.packages.find]
where = ["src"]
