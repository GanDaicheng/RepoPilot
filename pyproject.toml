[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "A controlled autonomous development agent for real Git repositories"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22,<1",
    "fastapi>=0.142,<1",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "openai>=3.24,<4",
    "pydantic>=2.13,<3",
    "unidiff>=0.7.5,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "deepseek_smoke: opt-in test that calls the real DeepSeek API",
    "integration: tests that exercise multiple RepoPilot components",
    "docker: tests that require a running Docker daemon",
    "qwen_smoke: opt-in test that calls the real Qwen API",
]

[tool.setuptools.packages.find]
where = ["src"]
